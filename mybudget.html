  <script>
    // Supabase Live Credentials Configuration
    const SUPABASE_URL = "https://cfywvihxafuqnkqxqvod.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zgOjuNIBscNr10Hz30HVmw__hQ3X04a";

    let supabaseClient = null;
    let currentBalance = 15630.71;
    let initialTransactions = [
      { id: 1, title: 'Nike Official Store', category: 'Shopping', amount: 110.00, type: 'expense', date: 'Today', time: '14:24', icon: '🛍' },
      { id: 2, title: 'Uber Eats - Sushi Bar', category: 'Dining', amount: 34.20, type: 'expense', date: 'Today', time: '12:15', icon: '🍱' },
      { id: 3, title: 'Bi-Weekly Direct Payroll', category: 'Income', amount: 3250.00, type: 'income', date: 'Yesterday', time: '09:00', icon: '💰' }
    ];

    // Initialize Supabase Client via CDN if key is valid
    if (window.supabase && SUPABASE_ANON_KEY) {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.log("Supabase initialization notice (using local fallback state):", err);
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      updateBalanceDisplay();
      renderTransactions(initialTransactions);
      loadSupabaseData();
    });

    function updateBalanceDisplay() {
      document.getElementById('balance-display').innerText = '$' + currentBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderTransactions(list) {
      const txList = document.getElementById('tx-list');
      txList.innerHTML = '';
      list.forEach(tx => {
        const isIncome = tx.type === 'income';
        const iconSymbol = tx.icon || (isIncome ? '💰' : '🛍');
        const formattedAmount = isIncome ? `+$${parseFloat(tx.amount).toFixed(2)}` : `-$${parseFloat(tx.amount).toFixed(2)}`;
        const amountClass = isIncome ? 'text-emerald-400' : 'text-zinc-100';

        const itemHTML = `
          <div class="p-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-2xl bg-zinc-800 flex items-center justify-center text-purple-400 font-bold">${iconSymbol}</div>
              <div>
                <div class="text-white text-sm font-medium">${tx.title || 'Transaction'}</div>
                <div class="text-zinc-400 text-xs">${tx.date || 'Today'} • ${tx.time || '12:00'}</div>
              </div>
            </div>
            <div class="text-sm font-semibold ${amountClass}">${formattedAmount}</div>
          </div>
        `;
        txList.insertAdjacentHTML('beforeend', itemHTML);
      });
    }

    async function loadSupabaseData() {
      if (!supabaseClient) return;

      try {
        // Query accounts table
        const { data: accounts, error: accErr } = await supabaseClient.from('accounts').select('*');
        if (!accErr && accounts && accounts.length > 0) {
          const primaryAcc = accounts[0];
          if (typeof primaryAcc.balance === 'number') {
            currentBalance = primaryAcc.balance;
          } else if (primaryAcc.balance) {
            currentBalance = parseFloat(primaryAcc.balance);
          }
          if (primaryAcc.holder_name || primaryAcc.holderName) {
            document.getElementById('holder-name').innerText = primaryAcc.holder_name || primaryAcc.holderName;
          }
          if (primaryAcc.account_number || primaryAcc.accountNumber) {
            document.getElementById('account-label').innerText = 'Account ' + (primaryAcc.account_number || primaryAcc.accountNumber);
          }
          updateBalanceDisplay();
        }

        // Query transactions table (ordered by created_at desc)
        const { data: txData, error: txErr } = await supabaseClient
          .from('transactions')
          .select('*')
          .order('created_at', { ascending: false });

        if (!txErr && txData && txData.length > 0) {
          renderTransactions(txData);
        }
      } catch (err) {
        console.log("Supabase fetch notice:", err);
      }
    }

    function toggleAddModal() {
      const modal = document.getElementById('add-modal');
      modal.classList.toggle('hidden');
    }

    async function saveTransaction() {
      const title = document.getElementById('tx-title').value.trim() || 'Quick Expense';
      const amountVal = parseFloat(document.getElementById('tx-amount').value) || 15.00;

      // Update local state instantly for snappy UI
      currentBalance -= amountVal;
      updateBalanceDisplay();

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const newTxObj = {
        title: title,
        category: 'Dining',
        amount: amountVal,
        type: 'expense',
        date: 'Today',
        time: timeStr,
        icon: '🛍'
      };

      // Prepend item to UI feed
      const txList = document.getElementById('tx-list');
      const itemHTML = `
        <div class="p-3.5 flex items-center justify-between animate-pulse">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-2xl bg-zinc-800 flex items-center justify-center text-purple-400 font-bold">💳</div>
            <div>
              <div class="text-white text-sm font-medium">${title}</div>
              <div class="text-zinc-400 text-xs">Just now</div>
            </div>
          </div>
          <div class="text-sm font-semibold text-zinc-100">-$${amountVal.toFixed(2)}</div>
        </div>
      `;
      txList.insertAdjacentHTML('afterbegin', itemHTML);

      // Clear input fields and close modal
      document.getElementById('tx-title').value = '';
      document.getElementById('tx-amount').value = '';
      toggleAddModal();

      // Live Supabase Sync if Client initialized
      if (supabaseClient) {
        try {
          // Insert into Supabase transactions table
          await supabaseClient.from('transactions').insert([
            {
              title: title,
              category: 'Dining',
              amount: amountVal,
              type: 'expense',
              date: 'Today',
              time: timeStr,
              created_at: new Date().toISOString()
            }
          ]);

          // Update balance in Supabase accounts table
          await supabaseClient.from('accounts').update({ balance: currentBalance }).gt('id', -1);
        } catch (err) {
          console.log('Supabase sync notice:', err);
        }
      }
    }
  </script>
</body>
</html>
